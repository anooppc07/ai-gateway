# Repository checks on every pull request and merge: no Azure access. Releases: release.yml and the shared units
# (_release, _policies, _models).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:   # model-intake starts it on the pull request it opens (its own token can't trigger pull_request runs)

permissions:
  contents: read

defaults:
  run:
    shell: bash   # -eo pipefail: "terraform plan | tee" fails the step when the plan fails

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          terraform: "true"
      - name: Scripts parse
        run: python -m compileall -q gateway/scripts scripts
      - name: Terraform format, validate and plan tests (mocked Azure)
        run: |
          for stack in gateway/terraform/gateway-policies gateway/terraform/platform-deployment; do
            terraform -chdir=$stack fmt -check -recursive
            terraform -chdir=$stack init -backend=false -input=false >/dev/null
            terraform -chdir=$stack validate
            terraform -chdir=$stack test
          done
