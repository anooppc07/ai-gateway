# Platform judge model of the test bed: scores evaluations (platform G4, project P5). It is a setting, not code:
# GitHub variable EVAL_JUDGE_MODEL names it; an evaluation pack may override it with judge_model.
name: gpt-5.1
api: openai
status: active
purpose: judge                             # scores evaluations only: Prompt Shields off for it (registry), harm categories on
owner: ai-platform-team
profile: general-purpose                   # model type: chooses the evaluation pack

model:
  format: OpenAI
  name: gpt-5.1
  version: "2025-11-13"

deployment:
  name: gpt-5.1
  sku: GlobalStandard
  capacity: 150                            # an evaluation run used ~97k judge tokens in 1-2 minutes; 50k throttled it
  version_upgrade: NoAutoUpgrade
  existing: false

guardrail: Microsoft.DefaultV2

docs_file: docs.md
tests_file: tests.yaml
